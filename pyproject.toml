[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physicslab"
dynamic = ["version"]
description = "Python API for Quantum-Physics App"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Arendelle", email = "Arendelle_@outlook.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
]
dependencies = [
    "urllib3",
]

[tool.hatch.version]
path = "physicslab/version.py"

[dependency-groups]
dev = [
    "coverage",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    # Lint tools. The project targets Python 3.14, so mypy needs no version
    # cap: it can both run on and target Python 3.14. The floor skips mypy
    # 1.x, which predates Python 3.14 support.
    "mypy>=2",
    # ruff is capped to keep the default rule set stable.
    "ruff>=0.16,<0.17",
]

[tool.mypy]
python_version = "3.14"

[tool.ruff]
line-length = 88
target-version = "py314"
