[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physicslab"
dynamic = ["version"]
description = "Python API for Quantum-Physics App"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Arendelle", email = "Arendelle_@outlook.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
]
dependencies = [
    "typing-extensions",
    "requests",
]

[tool.hatch.version]
path = "physicslab/version.py"

[dependency-groups]
dev = [
    "coverage",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    # Lint tools. mypy is capped below 1.15: mypy 1.15+ requires Python >= 3.9
    # to run (breaking `uv sync` on Python 3.8), and mypy 1.17+ can no longer
    # target `python_version = "3.8"`. 1.14.x supports both.
    "mypy>=1.14,<1.15",
    # ruff is capped to keep the default rule set stable.
    "ruff>=0.16,<0.17",
    "types-requests",
]

[tool.mypy]
python_version = "3.8"

[tool.ruff]
line-length = 88
target-version = "py38"
